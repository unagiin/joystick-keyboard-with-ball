CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610=y

# The nice!nano needs extra time on its switched VCC before the sensor answers.
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=1000

# Report the left battery to the host through this half.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# D10 (P0.09, toggle B) is an NFC pin by default.
CONFIG_NFCT_PINS_AS_GPIOS=y
